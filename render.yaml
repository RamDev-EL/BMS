# Render Blueprint for the BMS. Put the bms folder at the repo root, push, then
# Render > New > Blueprint. Set the three "sync: false" values in the dashboard.
databases:
  - name: bms-db
    plan: free
services:
  - type: web
    name: bms
    runtime: docker
    plan: free               # PILOT: free tier. Sleeps when idle; uploaded files are NOT kept across restarts.
    dockerfilePath: ./Dockerfile
    healthCheckPath: /app/
    # Production: change plan to starter and add this disk so uploads persist:
    # disk: {name: uploads, mountPath: /data/uploads, sizeGB: 5}
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: bms-db, property: connectionString}
      - key: JWT_SECRET
        generateValue: true
      - key: INTEGRATION_API_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "0"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Group Admin
