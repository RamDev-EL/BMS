<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F2937"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><title>BMS Driver</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A227;--gold-d:#9A7B1C;--gold-l:#F6EFD6;--bg:#F4F2EC;--ink:#111827;--ink2:#6B7280;--line:#E5E1D5;--ok:#15803d;--okb:#E7F5EC;--warn:#B45309;--warnb:#FEF3C7;--bad:#b91c1c;--badb:#FDECEC;--info:#1D4ED8;--infob:#E8EFFD}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 Inter,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);padding-bottom:env(safe-area-inset-bottom)}
header{background:#1F2937;color:#fff;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--gold)}
.brand{display:flex;align-items:center;gap:10px}.logo{width:32px;height:32px;border-radius:8px;background:var(--gold);color:#1F2937;font-weight:800;display:grid;place-items:center}
.brand b{display:block;font-size:15px;line-height:1.1}.brand small{color:#9CA3AF;font-size:11px}
#who{font-size:13px;color:#E5E7EB;display:flex;align-items:center;gap:8px}.av{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#1F2937;font-weight:700;font-size:12px;display:grid;place-items:center}
main{padding:16px;max-width:520px;margin:0 auto}
h2{font-size:20px;margin:2px 0 4px;letter-spacing:-.01em}h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin:22px 0 8px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 14px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(17,24,39,.04)}
.card.trip{border-left:4px solid var(--gold)}
.route{display:flex;gap:12px;margin:10px 0}.rail{display:flex;flex-direction:column;align-items:center;padding-top:4px}
.dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--gold-d);background:#fff}.dot.f{background:var(--gold-d)}.line{flex:1;width:2px;background:var(--line);margin:2px 0;min-height:18px}
.route b{display:block;font-size:16px}.route .muted{font-size:12px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.meta small{display:block;color:var(--ink2);font-size:11px;text-transform:uppercase;letter-spacing:.04em}.meta span{font-weight:600;font-size:14px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:12px}
input,select,textarea{width:100%;padding:12px;border:1px solid #D1CDBF;border-radius:10px;margin-top:5px;font:inherit;font-weight:400;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);outline-offset:0;border-color:var(--gold)}
input[type=file]{padding:10px;background:var(--bg);border-style:dashed}
button{width:100%;padding:14px;border-radius:10px;border:1px solid var(--gold-d);background:var(--gold-d);color:#fff;font:inherit;font-weight:600;margin-top:6px;cursor:pointer;min-height:48px}
button:active{transform:scale(.99)}button.ghost{background:#fff;color:var(--ink);border-color:#D1CDBF}button.dark{background:#1F2937;border-color:#1F2937}button:disabled{opacity:.6}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 6px}.actions button{margin:0}
.muted{color:var(--ink2);font-size:13px}.err{color:var(--bad);font-size:13px;min-height:18px;margin:6px 0 0}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;text-transform:capitalize}
.chip.assigned{background:var(--infob);color:var(--info)}.chip.started{background:var(--warnb);color:var(--warn)}.chip.completed{background:var(--okb);color:var(--ok)}
.empty{text-align:center;padding:28px 16px;color:var(--ink2)}.empty b{display:block;color:var(--ink);margin-bottom:4px}
.recent{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;margin-bottom:8px;font-size:14px}.recent b{font-weight:600}
.login{margin-top:6vh}.login .logo{width:48px;height:48px;font-size:22px;margin-bottom:14px;border-radius:12px}
</style></head><body><header><div class="brand"><div class="logo">B</div><div><b>BMS Driver</b><small>Administration Services</small></div></div><span id="who"></span></header><main id="m"></main>
<script src="driver.js?v=4"></script></body></html>
