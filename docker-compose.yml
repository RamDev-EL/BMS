services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: bms
      POSTGRES_PASSWORD: bms
      POSTGRES_DB: bms
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bms"]
      interval: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://bms:bms@db:5432/bms
      JWT_SECRET: change-me-in-production
      INTEGRATION_API_KEY: dev-integration-key-change-me
      SEED_DEMO: "1"
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
      - ./web:/srv/web:ro
      - ./driver:/srv/driver:ro
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
  uploads:
